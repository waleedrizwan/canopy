name: Canopy
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  CanopyCore:
    path: Core
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Canopy:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - App/Sources
    dependencies:
      - package: CanopyCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Canopy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "The camera is used as a light sensor to measure light levels."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CANOPY_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - CanopyUITests
  CanopyUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - App/UITests
    dependencies:
      - target: Canopy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CANOPY_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Canopy
